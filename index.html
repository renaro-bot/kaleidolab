<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KaleidoLab 2.0</title><style>*{box-sizing:border-box}body{margin:0;background:#101018;color:white;font:15px system-ui}canvas{width:100vw;height:100dvh;object-fit:contain;touch-action:none;display:block}#bar{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;pointer-events:none}button,select{background:#27243de8;color:white;border:1px solid #ffffff35;border-radius:12px;padding:10px;font:inherit;pointer-events:auto}#panel{position:fixed;bottom:12px;left:12px;right:12px;max-width:440px;margin:auto;background:#171526d9;backdrop-filter:blur(16px);border:1px solid #ffffff30;border-radius:20px;padding:14px;max-height:65dvh;overflow:auto}#panel[hidden]{display:none}.buttons{display:flex;flex-wrap:wrap;gap:6px}label{display:flex;align-items:center;justify-content:space-between;margin:9px 0;gap:10px}input[type=range]{width:60%;accent-color:#c99bff}small{display:block;color:#ddd;margin:8px 0}#status{overflow-wrap:anywhere}</style></head><body><canvas id=c width=1000 height=1000></canvas><div id=bar><button id=menu>☰ Tools</button><button id=full>⛶ Fullscreen</button><button id=save>↓ PNG</button></div><section id=panel><div class=buttons><button id=upload>Photo</button><button id=cam>Live camera</button><button id=flip>Switch</button><button id=stop>Stop camera</button><button id=record>Record</button><button id=random>Random</button><button id=reset>Reset</button></div><input id=file type=file accept="image/*" hidden><label>Mirrors <input id=segments type=range min=4 max=40 step=2 value=16></label><label>Zoom <input id=zoom type=range min=.3 max=5 step=.01 value=1></label><label>Rotation <input id=rot type=range min=-180 max=180 value=0></label><label>Color shift <input id=hue type=range min=0 max=360 value=0></label><label>Auto rotation <input id=speed type=range min=-60 max=60 value=0></label><label>Effect <select id=effect><option>Natural</option><option>Neon</option><option>Rainbow</option><option>Metallic</option><option>Psychedelic</option></select></label><small>Drag to move the sampling point. Pinch to zoom. Tap Tools to hide this panel.</small><small id=status>Choose a photo or start the camera.</small></section><script>
const $=id=>document.getElementById(id), c=$('c'), ctx=c.getContext('2d'), v=document.createElement('video'), src=document.createElement('canvas'), s=src.getContext('2d');v.muted=true;v.playsInline=true;let stream=null,facing='environment',photo=null,offsetX=0,offsetY=0,angle=0,last=0,rec=null,chunks=[];const status=t=>$('status').textContent=t;function demo(){src.width=src.height=600;let g=s.createLinearGradient(0,0,600,600);['#00dcff','#ff136c','#ffb500','#5322d9'].forEach((x,i)=>g.addColorStop(i/3,x));s.fillStyle=g;s.fillRect(0,0,600,600);for(let i=0;i<12;i++){s.fillStyle=i%2?'#ff99e0':'#0b5078';s.beginPath();s.arc(i*57,300+Math.sin(i)*170,55,0,7);s.fill()}}demo();
function draw(t){let dt=Math.min((t-last)/1000,.05);last=t;angle+=dt*Number($('speed').value)*Math.PI/180;if(stream&&v.readyState>=2){if(src.width!==v.videoWidth||src.height!==v.videoHeight){src.width=v.videoWidth;src.height=v.videoHeight}s.drawImage(v,0,0)}let n=+$('segments').value,a=2*Math.PI/n,r= Math.hypot(c.width,c.height)/2,z=+$('zoom').value,rotation=+$('rot').value*Math.PI/180+angle;ctx.fillStyle='#000';ctx.fillRect(0,0,c.width,c.height);let fx=$('effect').value;ctx.filter=`hue-rotate(${$('hue').value+(fx==='Rainbow'?t/30:0)}deg) `+({Neon:'saturate(2.5) contrast(1.25)',Metallic:'grayscale(.85) contrast(1.6)',Psychedelic:'saturate(3) hue-rotate(90deg)'}[fx]||'');let w=Math.max(src.width,src.height),scale=r/w*z*2;for(let i=0;i<n;i++){ctx.save();ctx.translate(c.width/2,c.height/2);ctx.rotate(i*a+rotation);if(i%2)ctx.scale(1,-1);ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r+3,-.001,a+.001);ctx.closePath();ctx.clip();ctx.scale(scale,scale);ctx.drawImage(src,-src.width/2+offsetX,-src.height/2+offsetY);ctx.restore()}ctx.filter='none';requestAnimationFrame(draw)}requestAnimationFrame(draw);
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;v.srcObject=null}async function camera(){stop();if(!isSecureContext||!navigator.mediaDevices?.getUserMedia){status('Live camera needs an HTTPS website in Chrome, not a downloaded file or restricted preview.');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing}},audio:false});v.srcObject=stream;await v.play();status('Camera active.')}catch(e){stop();status('Camera: '+e.name+'. Allow camera permission in Chrome site settings and retry.')}}$('cam').onclick=camera;$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';camera()};$('stop').onclick=()=>{stop();status('Camera stopped; last frame retained.')};$('upload').onclick=()=>$('file').click();$('file').onchange=()=>{let f=$('file').files[0];if(!f)return;let im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{stop();src.width=im.width;src.height=im.height;s.drawImage(im,0,0);URL.revokeObjectURL(url);offsetX=offsetY=0;status('Photo loaded.')};im.src=url};$('menu').onclick=()=>$('panel').hidden=!$('panel').hidden;$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){status('Fullscreen unavailable in this browser; hide Tools for a larger view.')}};function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}$('save').onclick=()=>c.toBlob(b=>download(b,'KaleidoLab-'+Date.now()+'.png'));$('record').onclick=()=>{if(rec?.state==='recording'){rec.stop();$('record').textContent='Record';return}try{chunks=[];rec=new MediaRecorder(c.captureStream(30));rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>download(new Blob(chunks,{type:rec.mimeType}),'KaleidoLab-'+Date.now()+(rec.mimeType.includes('mp4')?'.mp4':'.webm'));rec.start();$('record').textContent='Stop recording';status('Recording artwork (no audio).')}catch(e){status('Recording unsupported in this browser.')}};$('random').onclick=()=>{ $('segments').value=4+2*Math.floor(Math.random()*19);$('zoom').value=.8+Math.random()*2;$('rot').value=Math.random()*360-180;$('hue').value=Math.random()*360};$('reset').onclick=()=>{for(let [k,v] of Object.entries({segments:16,zoom:1,rot:0,hue:0,speed:0,effect:'Natural'}))$(k).value=v;offsetX=offsetY=angle=0};let pts=new Map();c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY])};c.onpointermove=e=>{if(!pts.has(e.pointerId))return;let old=pts.get(e.pointerId),other=[...pts.entries()].find(x=>x[0]!==e.pointerId)?.[1];if(other){let d=Math.hypot(old[0]-other[0],old[1]-other[1]);if(d>0)$('zoom').value= Math.max(.3,Math.min(5,+$('zoom').value*Math.hypot(e.clientX-other[0],e.clientY-other[1])/d))}else{offsetX+=(e.clientX-old[0])*src.width/c.clientWidth;offsetY+=(e.clientY-old[1])*src.height/c.clientHeight}pts.set(e.pointerId,[e.clientX,e.clientY])};c.onpointerup=c.onpointercancel=e=>pts.delete(e.pointerId);</script></body></html>
